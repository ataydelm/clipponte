<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClipPonte</title>
<meta name="description" content="Clipboard partilhado entre PC e telemóvel">
<meta name="theme-color" content="#1f6f5c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ClipPonte">
<style id="cp-style">
:root{
  --bg:#f4f5f2; --panel:#ffffff; --ink:#1b1f1d; --muted:#66706b; --line:#e2e5e0;
  --accent:#1f6f5c; --accent-ink:#ffffff; --accent-soft:#e3f0ec; --star:#c98a0b;
  --danger:#b3261e; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
  --r:12px;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#121514; --panel:#1b1f1d; --ink:#e8ece9; --muted:#9aa49f; --line:#2b312e;
    --accent:#4fb79c; --accent-ink:#0d1f1a; --accent-soft:#1d3029; --star:#e5b13a; --danger:#f2867f;
    --shadow:0 1px 2px rgba(0,0,0,.4); }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100%;max-width:720px;margin:0 auto;position:relative}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:8px;font-weight:650;font-size:15px;flex:1;min-width:0}
.brand svg{flex:none}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:#2e9e6a}.dot.syncing{background:#d9a21b}.dot.error{background:var(--danger)}.dot.local{background:var(--muted)}
.ib{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--ink);flex:none}
.ib:hover{background:var(--line)}
.ib.on{background:var(--accent);color:var(--accent-ink)}
.ib svg{width:20px;height:20px}
.tools{display:flex;gap:8px;padding:0 12px 8px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 10px;height:38px}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;height:100%}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.btn{border:1px solid var(--line);background:var(--panel);height:38px;padding:0 12px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.danger{color:var(--danger)}
.chips{display:flex;gap:6px;padding:0 12px 8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 11px;cursor:pointer;white-space:nowrap;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#banner:empty{display:none}
.banner{margin:0 12px 8px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);display:flex;gap:10px;align-items:center;font-size:13px}
.banner .grow{flex:1}
main{flex:1;overflow-y:auto;padding:0 12px 16px;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.item{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px;margin-bottom:8px;cursor:pointer;box-shadow:var(--shadow);position:relative;outline:none}
.item:hover{border-color:var(--muted)}
.item.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.item.flash{animation:flash .6s}
@keyframes flash{0%{background:var(--accent-soft)}100%{background:var(--panel)}}
.thumb{width:44px;height:44px;border-radius:8px;background:var(--bg);display:grid;place-items:center;flex:none;overflow:hidden;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:20px;height:20px}
.body{flex:1;min-width:0}
.txt{white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.txt.link{color:var(--accent)}
.meta{color:var(--muted);font-size:12px;margin-top:4px;display:flex;gap:6px;flex-wrap:wrap}
.num{font-variant-numeric:tabular-nums;color:var(--muted);font-size:10px;position:absolute;left:3px;top:2px;opacity:.7}
.item{padding-left:14px}
.acts{display:flex;gap:0;flex:none;margin:-4px -4px 0 0}
.acts .ib{width:30px;height:30px}
.acts .ib svg{width:17px;height:17px}
.acts .ib.star.on{color:var(--star);background:transparent}
.empty{color:var(--muted);text-align:center;padding:40px 20px}
.empty b{color:var(--ink);display:block;font-size:15px;margin-bottom:6px}
.kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
#toast{position:absolute;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;z-index:30}
#toast.show{opacity:1;transform:translateX(-50%)}
#drop{position:absolute;inset:6px;border:2px dashed var(--accent);border-radius:16px;background:color-mix(in srgb,var(--bg) 85%,transparent);display:none;place-items:center;font-weight:600;color:var(--accent);z-index:20}
#drop.show{display:grid}
/* modo oculto (compacto) */
.compactbar{display:none;align-items:center;gap:8px;padding:10px 12px}
#app.compact>*{display:none}
#app.compact>.compactbar{display:flex}
#app.compact>#toast{display:block}
.compactbar .grow{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* definições */
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;z-index:25}
.sheet.show{display:block}
.sheet .panel{position:absolute;right:0;top:0;bottom:0;width:min(420px,100%);background:var(--bg);overflow-y:auto;padding:14px;padding-top:max(14px,env(safe-area-inset-top))}
.sheet h2{font-size:17px;margin:0;flex:1}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:20px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0}
.row+.row{border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0}
.row small{display:block;color:var(--muted)}
.field{width:100%;height:36px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--panel)}
.seg{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:var(--panel)}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt small{display:block;color:var(--muted)}
.sub{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.help{color:var(--muted);font-size:12px}
.err{color:var(--danger);font-size:12px}
input[type=checkbox]{accent-color:var(--accent);width:18px;height:18px}
.pip-only{display:none}
body.in-pip .pip-only{display:inline-grid}
body.in-pip .bar{padding:6px 8px}
body.in-pip .tools,body.in-pip .chips{padding-left:8px;padding-right:8px}
body.in-pip main{padding:0 8px 8px}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect x="10" y="8" width="44" height="50" rx="9" fill="var(--accent)"/><rect x="22" y="4" width="20" height="10" rx="4" fill="var(--ink)"/><path d="M20 38c6-9 18-9 24 0" stroke="var(--accent-ink)" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M20 30h24" stroke="var(--accent-ink)" stroke-width="4" stroke-linecap="round"/></svg>
      <span>ClipPonte</span>
      <span id="syncDot" class="dot local" title="Só neste dispositivo"></span>
    </div>
    <button class="ib" id="btnInstall" title="Instalar app" hidden></button>
    <button class="ib" id="btnTop" title="Sempre visível (por cima das outras janelas)"></button>
    <button class="ib" id="btnHide" title="Ocultar"></button>
    <button class="ib" id="btnSettings" title="Definições"></button>
  </header>

  <div class="compactbar">
    <span class="dot local" id="syncDot2"></span>
    <span class="grow" id="compactLabel">ClipPonte</span>
    <button class="btn primary" id="btnShow">Mostrar</button>
  </div>

  <div class="tools">
    <label class="search"><span id="icoSearch"></span><input id="q" type="search" placeholder="Pesquisar" autocomplete="off"></label>
    <button class="btn primary" id="btnPaste" title="Adicionar o que está no clipboard"><span id="icoPaste"></span><span class="lbl">Colar aqui</span></button>
    <button class="ib" id="btnFile" title="Adicionar ficheiro ou imagem"></button>
    <input type="file" id="fileInput" multiple hidden>
  </div>

  <div class="chips" id="chips">
    <button class="chip on" data-f="all">Todos</button>
    <button class="chip" data-f="pinned">★ Favoritos</button>
    <button class="chip" data-f="text">Texto</button>
    <button class="chip" data-f="link">Links</button>
    <button class="chip" data-f="image">Imagens</button>
    <button class="chip" data-f="file">Ficheiros</button>
  </div>

  <div id="banner"></div>
  <main id="list" tabindex="-1"></main>
  <div id="drop">Largar aqui para adicionar</div>
  <div id="toast" role="status"></div>

  <div class="sheet" id="sheet">
    <div class="panel" id="settingsPanel"></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
